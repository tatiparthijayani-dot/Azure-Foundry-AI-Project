name: Azure Foundry GitOps

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

env:
  AZURE_RG_DEV: rg-foundry-dev
  AZURE_RG_PROD: rg-foundry-prod
  LOCATION: eastus

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Bicep
      run: az bicep install

    - name: Validate Bicep
      run: |
        az bicep build \
          --file main.bicep

  whatif-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: What If Dev
      run: |
        az deployment group what-if \
          --resource-group $AZURE_RG_DEV \
          --template-file main.bicep \
          --parameters parameters/dev.bicepparam

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: whatif-dev

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Dev
      run: |
        az deployment group create \
          --resource-group $AZURE_RG_DEV \
          --template-file main.bicep \
          --parameters parameters/dev.bicepparam

  whatif-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: What If Prod
      run: |
        az deployment group what-if \
          --resource-group $AZURE_RG_PROD \
          --template-file main.bicep \
          --parameters parameters/prod.bicepparam

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: whatif-prod

    environment:
      name: production

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Prod
      run: |
        az deployment group create \
          --resource-group $AZURE_RG_PROD \
          --template-file main.bicep \
          --parameters parameters/prod.bicepparam